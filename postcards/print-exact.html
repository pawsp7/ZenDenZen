<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Print zen postcards — 10.7 × 13.8 cm</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./cards.css" />
    <link rel="stylesheet" href="./print-exact.css" />
  </head>
  <body>
    
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="sprite">
      <symbol id="motif-stillness" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="11.5" fill="none" stroke="#2a2620" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="62 10" transform="rotate(-24 18 18)"/>
        <circle cx="26.5" cy="9.5" r="1.6" fill="#c4a574"/>
      </symbol>
      <symbol id="motif-breathe" viewBox="0 0 36 36">
        <path d="M4 26 L13 12 L22 26 Z" fill="#8a9a78" opacity="0.85"/>
        <path d="M14 26 L24 10 L33 26 Z" fill="#6f7a6a"/>
        <circle cx="24.5" cy="8" r="2" fill="#c4a574"/>
      </symbol>
      <symbol id="motif-balance" viewBox="0 0 36 36">
        <ellipse cx="18" cy="25.5" rx="9" ry="3.4" fill="#5c5852"/>
        <ellipse cx="18" cy="20.2" rx="7" ry="2.8" fill="#8a8378"/>
        <ellipse cx="18" cy="15.4" rx="5.1" ry="2.3" fill="#4f4b46"/>
        <ellipse cx="20.2" cy="12.6" rx="2.1" ry="1.1" fill="#8a9a78"/>
      </symbol>
    </svg>

        <div class="page">
          <article class="card front theme-stillness">
            <img class="art" src="./art/stillness.jpg" alt="Ink enso circle and a gold sun on rice paper" />
            <div class="frame"></div>
            <p class="word">stillness</p>
          </article>
        </div>
        <div class="page">
          <article class="card back theme-stillness">
            <div class="back-head">
              <svg aria-hidden="true"><use href="#motif-stillness"/></svg>
              <div>
                <p class="back-kicker">Postcard one</p>
                <div class="name">stillness</div>
              </div>
            </div>
            <div class="split">
              <section>
                <p class="label">A quiet note</p>
                <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
              </section>
              <div class="rule" aria-hidden="true"></div>
              <section class="address">
                <div class="stamp">stamp</div>
                <p class="label">Post</p>
                <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
              </section>
            </div>
            <div class="back-foot">
              <span class="brand">ZenDenZen</span>
              <span>10.7 × 13.8 cm</span>
            </div>
          </article>
        </div>
        <div class="page">
          <article class="card front theme-breathe">
            <img class="art" src="./art/breathe.jpg" alt="Misty watercolor mountains under a gold sun" />
            <div class="frame"></div>
            <p class="word">breathe</p>
          </article>
        </div>
        <div class="page">
          <article class="card back theme-breathe">
            <div class="back-head">
              <svg aria-hidden="true"><use href="#motif-breathe"/></svg>
              <div>
                <p class="back-kicker">Postcard two</p>
                <div class="name">breathe</div>
              </div>
            </div>
            <div class="split">
              <section>
                <p class="label">A quiet note</p>
                <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
              </section>
              <div class="rule" aria-hidden="true"></div>
              <section class="address">
                <div class="stamp">stamp</div>
                <p class="label">Post</p>
                <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
              </section>
            </div>
            <div class="back-foot">
              <span class="brand">ZenDenZen</span>
              <span>10.7 × 13.8 cm</span>
            </div>
          </article>
        </div>
        <div class="page">
          <article class="card front theme-balance">
            <img class="art" src="./art/balance.jpg" alt="Stacked river stones with a leaf and sand ripples" />
            <div class="frame"></div>
            <p class="word">balance</p>
          </article>
        </div>
        <div class="page">
          <article class="card back theme-balance">
            <div class="back-head">
              <svg aria-hidden="true"><use href="#motif-balance"/></svg>
              <div>
                <p class="back-kicker">Postcard three</p>
                <div class="name">balance</div>
              </div>
            </div>
            <div class="split">
              <section>
                <p class="label">A quiet note</p>
                <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
              </section>
              <div class="rule" aria-hidden="true"></div>
              <section class="address">
                <div class="stamp">stamp</div>
                <p class="label">Post</p>
                <div class="lines" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
              </section>
            </div>
            <div class="back-foot">
              <span class="brand">ZenDenZen</span>
              <span>10.7 × 13.8 cm</span>
            </div>
          </article>
        </div>
  </body>
</html>
